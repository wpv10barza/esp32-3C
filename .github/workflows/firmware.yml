name: Firmware ESP32 3C

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: esp32-3c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run command buffer regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/command_buffer/main.cpp \
            -o /tmp/test_command_buffer
          /tmp/test_command_buffer
      - name: Run command viewport regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/command_text_viewport/main.cpp \
            -o /tmp/test_command_text_viewport
          /tmp/test_command_text_viewport
      - name: Run virtual keyboard regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/virtual_keyboard/main.cpp \
            -o /tmp/test_virtual_keyboard
          /tmp/test_virtual_keyboard
      - name: Run end-to-end command UI regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/command_ui_integration/main.cpp \
            -o /tmp/test_command_ui_integration
          /tmp/test_command_ui_integration
      - name: Run static integration regression
        run: python test/command_ui_integration_regression.py

  compile:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile ESP-Hi C3 and ESP32-4848S040 firmware
        run: pio run --environment esp_hi_3c --environment panel_4848s040
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32-3c-firmware
          path: |
            .pio/build/esp_hi_3c/firmware.bin
            .pio/build/esp_hi_3c/bootloader.bin
            .pio/build/esp_hi_3c/partitions.bin
            .pio/build/panel_4848s040/firmware.bin
            .pio/build/panel_4848s040/bootloader.bin
            .pio/build/panel_4848s040/partitions.bin
          if-no-files-found: error
