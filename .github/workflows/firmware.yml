name: Firmware ESP32 3C

on:
  push:
    branches: [main, integrate/pr5-11-command-ui]
  pull_request:

permissions:
  contents: read

concurrency:
  group: esp32-3c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone command buffer regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/command_buffer_regression.cpp \
            -o /tmp/command_buffer_regression
          /tmp/command_buffer_regression
      - name: Verify standalone command field geometry regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/command_field_geometry_test.cpp \
            -o /tmp/command_field_geometry_test
          /tmp/command_field_geometry_test
      - name: Verify horizontal viewport and touch-to-caret regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/command_text_viewport_test.cpp \
            -o /tmp/command_text_viewport_test
          /tmp/command_text_viewport_test
      - name: Verify end-to-end command UI integration
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            test/test_command_ui_integration.cpp \
            -o /tmp/test_command_ui_integration
          /tmp/test_command_ui_integration

  compile:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile ESP-Hi C3 and ESP32-4848S040 firmware
        run: pio run --environment esp_hi_3c --environment panel_4848s040
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32-3c-firmware
          path: |
            .pio/build/esp_hi_3c/firmware.bin
            .pio/build/esp_hi_3c/bootloader.bin
            .pio/build/esp_hi_3c/partitions.bin
            .pio/build/panel_4848s040/firmware.bin
            .pio/build/panel_4848s040/bootloader.bin
            .pio/build/panel_4848s040/partitions.bin
          if-no-files-found: error
