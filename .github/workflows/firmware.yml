name: Firmware ESP32 3C

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: esp32-3c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Run native PlatformIO tests
        run: pio test --environment native
      - name: Verify 480x480 touch action zones
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            scripts/panel_480_touch_validation.cpp \
            -o /tmp/test_panel_480_touch_validation
          /tmp/test_panel_480_touch_validation

  compile:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression test for runtime commandBuffer
        run: python test/command_buffer_regression.py
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile ESP-Hi C3 and ESP32-4848S040 firmware
        run: pio run --environment esp_hi_3c --environment panel_4848s040
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32-3c-firmware
          path: |
            .pio/build/esp_hi_3c/firmware.bin
            .pio/build/esp_hi_3c/bootloader.bin
            .pio/build/esp_hi_3c/partitions.bin
            .pio/build/panel_4848s040/firmware.bin
            .pio/build/panel_4848s040/bootloader.bin
            .pio/build/panel_4848s040/partitions.bin
          if-no-files-found: error
